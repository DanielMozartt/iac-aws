apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mzhtml-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - {} 
  rules:
  - http: 
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mzhtml-service
            port:
              number: 80

